<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LadrillosJS — eval-free build</title>

    <!--
      No inline <style> here, and no inline <script>. Under `style-src 'self'`
      and `script-src 'self'` both are blocked, including the page's own. This
      is the part people usually trip over: the framework stops needing
      'unsafe-inline', but your own markup has to stop needing it too.
    -->
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Eval-free LadrillosJS</h1>
      <p class="lede">
        This page runs with no <code>'unsafe-eval'</code> and no
        <code>'unsafe-inline'</code>, with Trusted Types enforced. The
        components below are identical to the ones any other sample uses —
        they were compiled at build time instead of in the browser.
      </p>

      <csp-counter start="3"></csp-counter>
      <csp-greeting name="world"></csp-greeting>

      <csp-report></csp-report>
    </main>
  </body>
</html>
