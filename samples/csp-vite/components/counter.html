<div class="card">
  <h2>Counter</h2>

  <p class="value">Count: {count} &middot; Double: {count * 2}</p>

  <div class="row">
    <button onclick="count--">−</button>
    <button onclick="count++">+</button>
  </div>

  <p class="note">
    A template expression and two inline handlers. Under the default build all
    three are compiled in the browser with <code>Function()</code>. Here they
    were compiled at build time, which is why this page needs no
    <code>'unsafe-eval'</code>.
  </p>
</div>

<script>
  let start = 0;
  let count = Number(start);
</script>
