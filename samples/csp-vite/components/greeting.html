<div class="card">
    <h2>Two-way binding</h2>

    <label for="who">Name</label>
    <input id="who" type="text" $bind="name" />

    <p class="hello">Hello, {name || "stranger"}!</p>

    <p class="note">
        The styles on this card are applied as an adopted stylesheet, not an
        injected <code>&lt;style&gt;</code> element. Open devtools and look under
        this component's shadow root: there is no <code>&lt;style&gt;</code> to
        find, which is why <code>style-src</code> needs no
        <code>'unsafe-inline'</code>.
    </p>
</div>

<script>
    let name = "";
</script>
