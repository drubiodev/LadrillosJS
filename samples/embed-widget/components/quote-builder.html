<div class="widget">
  <header class="head">
    <p class="eyebrow">Estimate</p>
    <h2>Build your plan</h2>
  </header>

  <fieldset class="plans">
    <legend class="sr-only">Plan</legend>

    <label class="tile {plan === 'starter' ? 'is-on' : ''}">
      <input type="radio" name="plan" value="starter" $bind="plan" />
      <span class="tile-name">Starter</span>
      <span class="tile-price">{money(12)}<i>/seat</i></span>
      <span class="tile-blurb">For small teams finding their feet</span>
    </label>

    <label class="tile {plan === 'pro' ? 'is-on' : ''}">
      <input type="radio" name="plan" value="pro" $bind="plan" />
      <span class="tile-name">Pro</span>
      <span class="tile-price">{money(24)}<i>/seat</i></span>
      <span class="tile-blurb">Everything most teams need</span>
    </label>

    <label class="tile {plan === 'scale' ? 'is-on' : ''}">
      <input type="radio" name="plan" value="scale" $bind="plan" />
      <span class="tile-name">Scale</span>
      <span class="tile-price">{money(48)}<i>/seat</i></span>
      <span class="tile-blurb">Controls, audit logs, and SSO</span>
    </label>
  </fieldset>

  <div class="row">
    <label for="seats">Seats</label>

    <div class="stepper">
      <button type="button" onclick="seats = Math.max(1, Number(seats) - 1)" aria-label="Remove a seat">
        &minus;
      </button>
      <input id="seats" type="number" min="1" max="500" $bind="seats" />
      <button type="button" onclick="seats = Math.min(500, Number(seats) + 1)" aria-label="Add a seat">
        +
      </button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">Billing</span>

    <div class="segmented" role="group" aria-label="Billing period">
      <button type="button" class="{annual ? '' : 'is-on'}" aria-pressed="{!annual}" onclick="annual = false">
        Monthly
      </button>
      <button type="button" class="{annual ? 'is-on' : ''}" aria-pressed="{annual}" onclick="annual = true">
        Annual
      </button>
    </div>
  </div>

  <fieldset class="addons">
    <legend class="row-label">Add-ons</legend>

    <label class="check">
      <input type="checkbox" $bind="support" />
      <span>Priority support <i>{money(supportPrice)}/mo</i></span>
    </label>

    <label class="check">
      <input type="checkbox" $bind="onboarding" />
      <span>Guided onboarding <i>{money(onboardingPrice)}/mo</i></span>
    </label>
  </fieldset>

  <div class="total">
    <div>
      <span class="total-label">Your estimate</span>
      <show condition="annual">
        <span class="save">Saves {money(monthly() * 2)} a year</span>
      </show>
    </div>

    <p class="amount">
      {money(total())}<i>{annual ? "/yr" : "/mo"}</i>
    </p>
  </div>

  <button type="button" class="cta" onclick="submitted = true">
    <if condition="submitted">Thanks — we'll be in touch</if>
    <else>Get this quote</else>
  </button>

  <p class="fine">No card required. Cancel any time.</p>
</div>

<script>
  // Attributes configure an instance: <quote-builder plan="scale" seats="25">
  let plan = "pro";
  let seats = 5;
  let annual = true;
  let support = false;
  let onboarding = false;
  let submitted = false;

  const supportPrice = 99;
  const onboardingPrice = 49;

  const plans = [
    { id: "starter", name: "Starter", price: 12, blurb: "For small teams finding their feet" },
    { id: "pro", name: "Pro", price: 24, blurb: "Everything most teams need" },
    { id: "scale", name: "Scale", price: 48, blurb: "Controls, audit logs, and SSO" },
  ];

  function seatPrice() {
    const found = plans.find((p) => p.id === plan);
    return found ? found.price : plans[0].price;
  }

  function monthly() {
    const addons = (support ? supportPrice : 0) + (onboarding ? onboardingPrice : 0);
    return seatPrice() * Number(seats) + addons;
  }

  // Annual is billed at ten months.
  function total() {
    return annual ? monthly() * 10 : monthly();
  }

  function money(value) {
    return value.toLocaleString("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0,
    });
  }
</script>
