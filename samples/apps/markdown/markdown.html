<style>
  /* Reset */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
    background: #f8fafc;
    min-height: 100vh;
    color: #0f172a;
  }

  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* Header */
  h1 {
    font-size: 2rem;
    font-weight: 600;
    color: #0f172a;
    text-align: center;
    margin-bottom: 2rem;
    letter-spacing: -0.025em;
  }

  /* Layout */
  .markdown-component {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    height: 80vh;
  }

  /* Panel wrapper */
  #editor-wrapper,
  .preview-wrapper {
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
  }

  #editor-wrapper::before {
    content: "Markdown";
    padding: 0.75rem 1rem;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 0.875rem;
    font-weight: 500;
    color: #64748b;
  }

  .preview-wrapper::before {
    content: "Preview";
    padding: 0.75rem 1rem;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 0.875rem;
    font-weight: 500;
    color: #64748b;
  }

  /* Editor */
  #markdown-editor {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    padding: 1rem;
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 0.875rem;
    line-height: 1.5;
    color: #0f172a;
    background: white;
  }

  #markdown-editor::placeholder {
    color: #94a3b8;
  }

  /* Preview */
  #html-wrapper {
    flex: 1;
    overflow-y: auto;
    background: white;
  }

  #html-output {
    padding: 1rem;
    max-width: none;
  }

  /* Typography */
  #html-output h1 {
    font-size: 1.875rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 1rem 0;
    line-height: 1.2;
    letter-spacing: -0.025em;
  }

  #html-output h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #1e293b;
    margin: 2rem 0 0.75rem 0;
    line-height: 1.3;
    letter-spacing: -0.025em;
  }

  #html-output h3 {
    font-size: 1.25rem;
    font-weight: 600;
    color: #334155;
    margin: 1.5rem 0 0.5rem 0;
    line-height: 1.4;
  }

  #html-output h4,
  #html-output h5,
  #html-output h6 {
    font-size: 1rem;
    font-weight: 600;
    color: #475569;
    margin: 1.25rem 0 0.5rem 0;
    line-height: 1.5;
  }

  #html-output p {
    color: #334155;
    line-height: 1.6;
    margin-bottom: 1rem;
  }

  #html-output ul {
    margin: 1rem 0;
    padding-left: 1.5rem;
    list-style-type: disc;
  }

  #html-output li {
    color: #334155;
    margin-bottom: 0.25rem;
    line-height: 1.6;
    padding-left: 0;
  }

  #html-output li::before {
    display: none;
  }

  #html-output strong {
    font-weight: 600;
    color: #0f172a;
  }

  #html-output em {
    font-style: italic;
    color: #475569;
  }

  #html-output a {
    color: #2563eb;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.2s ease;
    font-weight: 500;
  }

  #html-output a:hover {
    text-decoration-color: #2563eb;
  }

  /* Scrollbar */
  #html-wrapper::-webkit-scrollbar {
    width: 8px;
  }

  #html-wrapper::-webkit-scrollbar-track {
    background: #f1f5f9;
  }

  #html-wrapper::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }

  #html-wrapper::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .app-container {
      padding: 1rem;
    }

    .markdown-component {
      grid-template-columns: 1fr;
      height: auto;
      gap: 1rem;
    }

    #editor-wrapper,
    .preview-wrapper {
      height: 50vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
  }
</style>

<div class="app-container">
  <h1>Markdown Editor</h1>
  <div class="markdown-component">
    <div id="editor-wrapper">
      <textarea
        id="markdown-editor"
        oninput="parseMarkdown()"
        placeholder="Type your markdown here..."
      ></textarea>
    </div>

    <div class="preview-wrapper">
      <div id="html-wrapper">
        <div id="html-output"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const editor = $querySelector("#markdown-editor");
  const output = $querySelector("#html-output");

  const parseMarkdown = () => {
    console.log("Parsing markdown...");
    let text = editor.value;

    // headings
    text = text
      .replace(/^###### (.*)$/gm, "<h6>$1</h6>")
      .replace(/^##### (.*)$/gm, "<h5>$1</h5>")
      .replace(/^#### (.*)$/gm, "<h4>$1</h4>")
      .replace(/^### (.*)$/gm, "<h3>$1</h3>")
      .replace(/^## (.*)$/gm, "<h2>$1</h2>")
      .replace(/^# (.*)$/gm, "<h1>$1</h1>");
    // bold & italic
    text = text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
    // links
    text = text.replace(
      /\[(.+?)\]\((.+?)\)/g,
      '<a href="$2" target="_blank">$1</a>'
    );
    // unordered lists
    if (text.match(/^\s*-\s+/m)) {
      text = text
        .replace(/^\s*-\s+(.*)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>)/gms, "<ul>$1</ul>");
    }

    output.innerHTML = text;
  };
</script>
