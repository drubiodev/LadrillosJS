<h2>Loop with Index Example</h2>
<ul>
  <li $for="(name,i) in names" onclick="getDetails({i})">
    {i + 1} : {name.toUpperCase()}
  </li>
</ul>

<ul>
  <li $for="(c,i) in componetsList" onclick="getDetails('{c.name}')">
    <img src="{c.img}" alt="{c.name}" />
  </li>
</ul>

<button onclick="updateCount(count + 1)">Increment Count</button>

count: {count}

<script type="module" src="./starter.js"></script>

<script>
  const names = ["Alice", "Bob", "Charlie"];

  const componetsList = [
    {
      name: "Rand Component",
      tag: "rand-component",
      img: "https://placehold.co/80x40",
    },
  ];

  const getDetails = (id) => {
    console.log("Clicked on item with id:", id);
  };

  $onMount(() => {
    console.log("✅ $onMount - Component initialized and ready!");
    console.log("   State:", $state);
  });

  $onUpdate(() => {
    console.log("🔄 $onUpdate - Component state changed and re-rendered");
    console.log("   Current count:", $state.count);
  });

  $onUnmount(() => {
    console.log("❌ $onUnmount - Component is being removed from DOM");
  });
</script>
