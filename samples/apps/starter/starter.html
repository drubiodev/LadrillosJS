<style>
  p {
    color: blue;
  }
</style>

<p>Name binding: {name}</p>
<p>param binding: {param}</p>
<p>Object binding Person Name: {person.name}</p>
<p>MyName Function: {MyName("Peter")}</p>
<button onclick="updateName('Jessica')">updateName</button>
<button onclick="MyName('Pedro')">updateName 2</button>

<script>
  console.log("Hello from starter component");

  let name = "LadrillosJS";

  const person = {
    name: "Daniel",
  };

  const updateName = (newName) => {
    console.log("Updating name to: " + newName);
    name = newName;
  };

  const MyName = (name) => {
    console.log(name);
    return name.toUpperCase();
  };
</script>
