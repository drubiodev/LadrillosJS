<div class="container">
  <h2>User List</h2>

  <div class="user-card" $for="(user, index) in users">
    <span class="badge">{index + 1}</span>
    <h3>{user.name}</h3>
    <p>Email: {user.email}</p>
    <p>Role: {user.role}</p>
  </div>

  <p $if="{users.length === 0}">No users found.</p>

  <button onclick="addUser()">Add User</button>
</div>

<script>
  let users = [
    { name: "John Doe", email: "john@example.com", role: "Developer" },
    { name: "Jane Smith", email: "jane@example.com", role: "Designer" },
    { name: "Bob Johnson", email: "bob@example.com", role: "Manager" },
  ];

  const names = ["Alice Brown", "Charlie Wilson", "Diana Moore"];
  const roles = ["Developer", "Designer", "Manager", "Analyst"];

  const addUser = () => {
    const randomName = names[Math.floor(Math.random() * names.length)];
    const randomRole = roles[Math.floor(Math.random() * roles.length)];
    const email = randomName.toLowerCase().replace(" ", ".") + "@example.com";

    users = [...users, { name: randomName, email, role: randomRole }];
  };
</script>

<style>
  .container {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  h2 {
    color: #333;
    margin-top: 0;
  }

  .user-card {
    position: relative;
    padding: 1.5rem;
    margin: 1rem 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 8px;
  }

  .badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(255, 255, 255, 0.3);
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.875rem;
    font-weight: bold;
  }

  .user-card h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1.5rem;
  }

  .user-card p {
    margin: 0.25rem 0;
    opacity: 0.95;
  }

  button {
    padding: 0.75rem 1.5rem;
    margin-top: 1rem;
    font-size: 1rem;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  button:hover {
    background: #764ba2;
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }
</style>
