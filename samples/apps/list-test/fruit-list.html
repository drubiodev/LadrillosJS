<div class="container">
  <h2>My Favorite Fruits</h2>

  <ul>
    <li $for="fruit in fruits" class="fruit-item">{fruit}</li>
  </ul>

  <p>Total: {fruits.length} fruits</p>

  <button onclick="addFruit()">Add Random Fruit</button>
  <button onclick="removeLast()">Remove Last</button>
</div>

<script>
  let fruits = ["Apple", "Banana", "Orange", "Mango"];

  const fruitOptions = [
    "Strawberry",
    "Blueberry",
    "Kiwi",
    "Grape",
    "Peach",
    "Pear",
  ];

  const addFruit = () => {
    const randomFruit =
      fruitOptions[Math.floor(Math.random() * fruitOptions.length)];
    fruits = [...fruits, randomFruit];
  };

  const removeLast = () => {
    if (fruits.length > 0) {
      fruits = fruits.slice(0, -1);
    }
  };
</script>

<style>
  .container {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  h2 {
    color: #333;
    margin-top: 0;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  .fruit-item {
    padding: 0.75rem 1rem;
    margin: 0.5rem 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 4px;
    font-size: 1rem;
  }

  button {
    padding: 0.75rem 1.5rem;
    margin: 0.5rem 0.5rem 0 0;
    font-size: 1rem;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  button:hover {
    background: #764ba2;
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  p {
    color: #666;
    font-size: 1rem;
    margin: 1rem 0;
  }
</style>
