<link rel="stylesheet" href="./src/css/slideshow.css" />

<div class="slideshow">
  <div class="slides">
    <intro-slide class="slide"></intro-slide>
    <code-slide class="slide"></code-slide>
    <getting-started-1 class="slide"></getting-started-1>
    <social-slide class="slide"></social-slide>
  </div>

  <button class="prev" onclick="prevSlide()" aria-label="Previous slide">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button class="next" onclick="nextSlide()" aria-label="Next slide">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>

<script type="module">
  import { registerComponents } from "ladrillosjs";
  registerComponents([
    { name: "intro-slide", path: "./src/components/slides/intro-slide.html" },
    { name: "code-slide", path: "./src/components/slides/code-slide.html" },
    {
      name: "social-slide",
      path: "./src/components/slides/socials-slide.html",
    },
    {
      name: "getting-started-1",
      path: "./src/components/slides/getting-started-slide-1.html",
    },
  ]);
</script>

<script>
  const totalSlides = 4;
  let currentSlide = 0;

  // Get all slide elements
  const slides = $querySelectorAll(".slide");

  // Function to update active slide
  const updateSlides = () => {
    slides.forEach((slide, index) => {
      if (index === currentSlide) {
        slide.classList.add("active");
      } else {
        slide.classList.remove("active");
      }
    });
  };

  // // Initialize the first slide as active
  updateSlides();

  const nextSlide = () => {
    currentSlide = (currentSlide + 1) % totalSlides;
    updateSlides();
  };

  const prevSlide = () => {
    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
    updateSlides();
  };

  document.addEventListener("keyup", (event) => {
    if (event.key === "ArrowRight") {
      nextSlide();
    } else if (event.key === "ArrowLeft") {
      prevSlide();
    }
  });
</script>
