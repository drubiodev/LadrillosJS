<style>
  h1 {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 300;
    margin-bottom: 2rem;
  }

  .beer-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2rem;
    list-style: none;
    padding: 0;
    min-height: 300px; /* Reserve space to prevent shift during loading */
  }
</style>

<h1>Beers</h1>
<ul class="beer-list">
  {beers}
</ul>
