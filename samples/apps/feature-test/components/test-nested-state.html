<div>
  <h4>Nested State Objects</h4>
  <p>User Name: {user.name}</p>
  <p>User Email: {user.email}</p>
  <p>User Age: {user.age}</p>
  <p>Address: {user.address.street}, {user.address.city}</p>

  <button onclick="updateName()">Update Name</button>
  <button onclick="updateAddress()">Update Address</button>
  <button onclick="incrementAge()">Increment Age</button>

  <p><small>Tests: Nested object state and deep property binding</small></p>
</div>

<script>
  let user = {
    name: "Alice",
    email: "alice@example.com",
    age: 28,
    address: {
      street: "123 Main St",
      city: "Springfield",
    },
  };

  const updateName = () => {
    user.name = `User ${Math.floor(Math.random() * 100)}`;
  };

  const updateAddress = () => {
    user.address.city = `City ${Math.floor(Math.random() * 100)}`;
  };

  const incrementAge = () => {
    user.age++;
  };
</script>
