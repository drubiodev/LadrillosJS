<div>
  <h4>Props Component</h4>
  <p>Name prop: {name}</p>
  <p>Age prop: {age}</p>
  <p>Active prop: {active}</p>
  <p>Type of active: {typeof active}</p>

  <button onclick="incrementAge()">Increment Age</button>

  <p><small>Tests: Component props passed via attributes</small></p>
</div>

<script>
  // Props are automatically available from attributes
  let name = "default";
  let age = 0;
  let active = false;

  const incrementAge = () => {
    age++;
  };
</script>
