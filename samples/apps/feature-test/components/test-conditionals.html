<div>
  <button onclick="toggleShow()">Toggle Show</button>
  <button onclick="changeScore()">Change Score</button>
  <p>Score: {score}</p>

  <div $if="show">
    <p>✓ This is visible when show=true</p>
  </div>

  <div $if="score > 50">
    <p>✓ Score is greater than 50</p>
  </div>
  <div $else-if="score > 25">
    <p>✓ Score is greater than 25 but not 50</p>
  </div>
  <div $else>
    <p>✓ Score is 25 or less</p>
  </div>

  <p><small>Tests: $if, $else-if, $else conditional rendering</small></p>
</div>

<script>
  let show = true;
  let score = 10;

  const toggleShow = () => {
    show = !show;
  };

  const changeScore = () => {
    score = Math.floor(Math.random() * 100);
  };
</script>
