<div>
  <button onclick="handleClick()">Click Me</button>
  <p>Clicks: {clickCount}</p>

  <button onclick="handleWithArgs('Hello', 123)">Click with Args</button>
  <p>Last args: {lastArgs}</p>

  <input
    type="text"
    onkeyup="handleKeyup(event)"
    placeholder="Type something"
  />
  <p>Key pressed: {lastKey}</p>

  <input
    type="text"
    onfocus="handleFocus()"
    onblur="handleBlur()"
    placeholder="Focus/Blur test"
  />
  <p>Focus state: {focusState}</p>

  <p><small>Tests: onclick, onkeyup, onfocus, onblur events</small></p>
</div>

<script>
  let clickCount = 0;
  let lastArgs = "none";
  let lastKey = "none";
  let focusState = "none";

  const handleClick = () => {
    clickCount++;
  };

  const handleWithArgs = (str, num) => {
    lastArgs = `${str}, ${num}`;
  };

  const handleKeyup = (event) => {
    lastKey = event.key;
  };

  const handleFocus = () => {
    focusState = "focused";
  };

  const handleBlur = () => {
    focusState = "blurred";
  };
</script>
