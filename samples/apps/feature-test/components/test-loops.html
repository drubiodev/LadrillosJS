<div>
  <button onclick="addItem()">Add Item</button>
  <button onclick="removeItem()">Remove Last</button>
  <button onclick="updateFirst()">Update First Item</button>
  <p>Total items: {items.length}</p>

  <ul>
    <li $for="item in items">{item.name} - Qty: {item.qty}</li>
  </ul>

  <h4>With Index:</h4>
  <ul>
    <li $for="(item, index) in items">[{index}] {item.name}</li>
  </ul>

  <h4>Simple Array:</h4>
  <ul>
    <li $for="color in colors">{color}</li>
  </ul>

  <p>
    <small>Tests: $for loops with objects, with index, and simple arrays</small>
  </p>
</div>

<script>
  let items = [
    { name: "Apple", qty: 5 },
    { name: "Banana", qty: 3 },
    { name: "Orange", qty: 7 },
  ];

  let colors = ["Red", "Green", "Blue"];

  let counter = 1;

  const addItem = () => {
    items.push({
      name: `Item ${counter++}`,
      qty: Math.floor(Math.random() * 10),
    });
  };

  const removeItem = () => {
    if (items.length > 0) {
      items.pop();
    }
  };

  const updateFirst = () => {
    console.log("Update first item: ", items.length);
    if (items.length > 0) {
      items[0].name = `Updated ${Date.now()}`;
    }
  };
</script>
