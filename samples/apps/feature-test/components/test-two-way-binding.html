<div>
  <p>
    Type something: <input type="text" $bind="text" placeholder="Type here" />
  </p>
  <p>Display: {text}</p>

  <p>Number: <input type="number" $bind="number" /></p>
  <p>Value: {number}</p>

  <p>Checkbox: <input type="checkbox" $bind="checked" /></p>
  <p>Checked: {checked}</p>

  <p>
    <textarea $bind="textarea" placeholder="Multi-line text"></textarea>
  </p>
  <p>Text area content: {textarea}</p>

  <p>
    <small
      >Tests: Two-way binding with $bind on input, number, checkbox, and
      textarea</small
    >
  </p>
</div>

<script>
  let text = "Initial value";
  let number = 42;
  let checked = false;
  let textarea = "Multi-line\ncontent";
</script>
