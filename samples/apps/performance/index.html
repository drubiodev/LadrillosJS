<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Test - LadrillosJS vs Vanilla</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: #f5f5f5;
        padding: 2rem;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 2rem;
      }

      .controls {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      button {
        padding: 0.75rem 1.5rem;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }

      button:hover {
        background: #1669c1;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      .result-card {
        background: white;
        padding: 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .result-card h2 {
        color: #333;
        margin-bottom: 1rem;
        font-size: 1.5rem;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }

      .metric:last-child {
        border-bottom: none;
      }

      .metric-label {
        color: #666;
      }

      .metric-value {
        font-weight: bold;
        color: #1a73e8;
      }

      .winner {
        background: #e8f5e9;
        border-left: 4px solid #4caf50;
      }

      .test-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }

      .test-container {
        background: white;
        padding: 1.5rem;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .test-container h3 {
        margin-bottom: 1rem;
        color: #333;
      }

      .component-container {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid #eee;
        padding: 0.5rem;
        border-radius: 0.25rem;
      }

      .status {
        text-align: center;
        padding: 1rem;
        background: #fff3cd;
        border-radius: 0.375rem;
        margin-bottom: 2rem;
        color: #856404;
      }

      @media (max-width: 768px) {
        .results,
        .test-area {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚡ Performance Test: LadrillosJS vs Vanilla Web Components</h1>

      <div class="controls">
        <button id="test-1k">Test 1,000 Updates</button>
        <button id="test-5k">Test 5,000 Updates</button>
        <button id="test-10k">Test 10,000 Updates</button>
        <button id="test-100k">Test 100,000 Updates</button>
        <button id="clear">Clear Results</button>
      </div>

      <div id="status" class="status" style="display: none"></div>

      <div class="results" id="results" style="display: none">
        <div class="result-card" id="ladrillos-results">
          <h2>🧱 LadrillosJS</h2>
          <div class="metric">
            <span class="metric-label">Total Time:</span>
            <span class="metric-value" id="ladrillos-time">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">Updates/sec:</span>
            <span class="metric-value" id="ladrillos-rate">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">Avg per Update:</span>
            <span class="metric-value" id="ladrillos-avg">-</span>
          </div>
        </div>

        <div class="result-card" id="vanilla-results">
          <h2>⚪ Vanilla</h2>
          <div class="metric">
            <span class="metric-label">Total Time:</span>
            <span class="metric-value" id="vanilla-time">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">Updates/sec:</span>
            <span class="metric-value" id="vanilla-rate">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">Avg per Update:</span>
            <span class="metric-value" id="vanilla-avg">-</span>
          </div>
        </div>
      </div>

      <div class="test-area">
        <div class="test-container">
          <h3>🧱 LadrillosJS Counter</h3>
          <div class="component-container">
            <ladrillos-counter></ladrillos-counter>
          </div>
        </div>

        <div class="test-container">
          <h3>⚪ Vanilla Counter</h3>
          <div class="component-container">
            <vanilla-counter></vanilla-counter>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { registerComponent } from "ladrillosjs";
      registerComponent("ladrillos-counter", "ladrillos-counter.html");

      // Define Vanilla Web Component
      class VanillaCounter extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this._count = 0;
        }

        connectedCallback() {
          this.render();
        }

        get count() {
          return this._count;
        }

        set count(value) {
          this._count = value;
          this.render();
        }

        render() {
          this.shadowRoot.innerHTML = `
              <div>Count: ${this._count}</div>
          `;
        }
      }

      customElements.define("vanilla-counter", VanillaCounter);

      // Performance testing logic
      const buttons = {
        test1k: document.getElementById("test-1k"),
        test5k: document.getElementById("test-5k"),
        test10k: document.getElementById("test-10k"),
        test100k: document.getElementById("test-100k"),
        clear: document.getElementById("clear"),
      };

      const status = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      async function runTest(updateCount) {
        // Disable buttons
        Object.values(buttons).forEach((btn) => (btn.disabled = true));

        // Show status
        status.style.display = "block";
        status.textContent = `Running ${updateCount.toLocaleString()} updates...`;

        // Get components
        const ladrillosCounter = document.querySelector("ladrillos-counter");
        const vanillaCounter = document.querySelector("vanilla-counter");

        // Reset counters
        ladrillosCounter.count = 0;
        vanillaCounter.count = 0;

        await new Promise((resolve) => setTimeout(resolve, 100));

        // Test LadrillosJS
        status.textContent = `Testing LadrillosJS... (${updateCount.toLocaleString()} updates)`;
        await new Promise((resolve) => setTimeout(resolve, 50));

        const ladrillosStart = performance.now();
        for (let i = 0; i < updateCount; i++) {
          ladrillosCounter.count = i;
          // Add micro-delay every 100 updates to prevent blocking
          if (i % 100 === 0) {
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }
        const ladrillosEnd = performance.now();
        const ladrillosTime = ladrillosEnd - ladrillosStart;

        await new Promise((resolve) => setTimeout(resolve, 100));

        // Test Vanilla
        status.textContent = `Testing Vanilla... (${updateCount.toLocaleString()} updates)`;
        await new Promise((resolve) => setTimeout(resolve, 50));

        const vanillaStart = performance.now();
        for (let i = 0; i < updateCount; i++) {
          vanillaCounter.count = i;
          // Add micro-delay every 100 updates to prevent blocking
          if (i % 100 === 0) {
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }
        const vanillaEnd = performance.now();
        const vanillaTime = vanillaEnd - vanillaStart;

        // Display results
        displayResults({
          ladrillos: {
            time: ladrillosTime,
            count: updateCount,
          },
          vanilla: {
            time: vanillaTime,
            count: updateCount,
          },
        });

        // Hide status
        status.style.display = "none";

        // Enable buttons
        Object.values(buttons).forEach((btn) => (btn.disabled = false));
      }

      function displayResults(data) {
        resultsDiv.style.display = "grid";

        const { ladrillos, vanilla } = data;

        // Calculate metrics
        const ladrillosRate = (
          (ladrillos.count / ladrillos.time) *
          1000
        ).toFixed(2);
        const vanillaRate = ((vanilla.count / vanilla.time) * 1000).toFixed(2);
        const ladrillosAvg = (ladrillos.time / ladrillos.count).toFixed(4);
        const vanillaAvg = (vanilla.time / vanilla.count).toFixed(4);

        // Update LadrillosJS results
        document.getElementById(
          "ladrillos-time"
        ).textContent = `${ladrillos.time.toFixed(2)}ms`;
        document.getElementById(
          "ladrillos-rate"
        ).textContent = `${ladrillosRate}`;
        document.getElementById(
          "ladrillos-avg"
        ).textContent = `${ladrillosAvg}ms`;

        // Update Vanilla results
        document.getElementById(
          "vanilla-time"
        ).textContent = `${vanilla.time.toFixed(2)}ms`;
        document.getElementById("vanilla-rate").textContent = `${vanillaRate}`;
        document.getElementById("vanilla-avg").textContent = `${vanillaAvg}ms`;

        // Highlight winner
        const ladrillosCard = document.getElementById("ladrillos-results");
        const vanillaCard = document.getElementById("vanilla-results");

        ladrillosCard.classList.remove("winner");
        vanillaCard.classList.remove("winner");

        if (ladrillos.time < vanilla.time) {
          ladrillosCard.classList.add("winner");
        } else {
          vanillaCard.classList.add("winner");
        }
      }

      function clearResults() {
        resultsDiv.style.display = "none";
        const ladrillosCounter = document.querySelector("ladrillos-counter");
        const vanillaCounter = document.querySelector("vanilla-counter");
        ladrillosCounter.count = 0;
        vanillaCounter.count = 0;
      }

      // Event listeners
      buttons.test1k.addEventListener("click", () => runTest(1000));
      buttons.test5k.addEventListener("click", () => runTest(5000));
      buttons.test10k.addEventListener("click", () => runTest(10000));
      buttons.test100k.addEventListener("click", () => runTest(100000));
      buttons.clear.addEventListener("click", clearResults);
    </script>
  </body>
</html>
