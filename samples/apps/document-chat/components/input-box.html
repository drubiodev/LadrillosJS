<style>
  :host {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    border-radius: 1.5rem;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .input-wrapper:focus-within {
    background: #ffffff;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }

  input {
    flex: 1;
    padding: 0.875rem 1.25rem;
    background: transparent;
    border: none;
    outline: none;
    font-size: 0.9375rem;
    color: #1f2937;
    line-height: 1.5;
  }

  input::placeholder {
    color: #9ca3af;
  }

  button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }

  button:active {
    transform: scale(0.95);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .icon {
    font-size: 1.125rem;
  }
</style>
<div class="input-wrapper">
  <input placeholder="Message AI..." />
</div>
<button><span class="icon">↑</span></button>
