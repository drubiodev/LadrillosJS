<div class="demo-card">
  <h3>👁️ Show/Hide Toggle</h3>
  <p class="description">
    Use <code>&lt;show&gt;</code> for CSS-based visibility (keeps element in DOM)
  </p>

  <div class="demo-content">
    <div class="toggle-group">
      <button onclick="showPanel1 = !showPanel1" class="toggle-btn">
        {showPanel1 ? 'Hide' : 'Show'} Panel 1
      </button>
      <button onclick="showPanel2 = !showPanel2" class="toggle-btn">
        {showPanel2 ? 'Hide' : 'Show'} Panel 2
      </button>
      <button onclick="showPanel3 = !showPanel3" class="toggle-btn">
        {showPanel3 ? 'Hide' : 'Show'} Panel 3
      </button>
    </div>

    <div class="panels">
      <show condition="showPanel1">
        <div class="panel panel-1">
          <span class="icon">🎨</span>
          <span>Panel 1 - Design</span>
        </div>
      </show>

      <show condition="showPanel2">
        <div class="panel panel-2">
          <span class="icon">⚙️</span>
          <span>Panel 2 - Settings</span>
        </div>
      </show>

      <show condition="showPanel3">
        <div class="panel panel-3">
          <span class="icon">📊</span>
          <span>Panel 3 - Analytics</span>
        </div>
      </show>
    </div>

    <div class="difference">
      <h4>&lt;show&gt; vs &lt;if&gt;</h4>
      <p>
        <strong>&lt;show&gt;:</strong> Toggles <code>display: none</code> (element
        stays in DOM)
      </p>
      <p><strong>&lt;if&gt;:</strong> Adds/removes element from DOM entirely</p>
    </div>
  </div>

  <div class="code-hint">
    <code $no:bind>&lt;show condition="isVisible"&gt;...&lt;/show&gt;</code>
  </div>
</div>

<script>
  let showPanel1 = true;
  let showPanel2 = true;
  let showPanel3 = false;
</script>
