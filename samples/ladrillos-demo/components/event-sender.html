<div class="demo-card">
  <h3>📡 Event Bus - Sender</h3>
  <p class="description">
    Use <code>$emit</code> to broadcast events across components
  </p>

  <div class="demo-content">
    <div class="input-section">
      <label>Enter a message:</label>
      <input type="text" $bind="message" placeholder="Type something..." />
    </div>

    <div class="color-section">
      <label>Pick a theme:</label>
      <div class="color-buttons">
        <button
          $for="c in colors"
          onclick="sendTheme(c.value)"
          class="color-btn"
          style="background: {c.value}"
        >
          {c.name}
        </button>
      </div>
    </div>

    <div class="action-buttons">
      <button onclick="sendMessage()" class="send-btn">📤 Send Message</button>
      <button onclick="sendNotification()" class="notify-btn">
        🔔 Send Notification
      </button>
    </div>

    <div class="sent-log">
      <p>Last sent: {lastSent || 'Nothing yet'}</p>
    </div>
  </div>

  <div class="code-hint">
    <code $no:bind>$emit("message-sent", { text: message })</code>
  </div>
</div>

<script>
  let message = "";
  let lastSent = "";

  let colors = [
    { name: "🔴", value: "#ef4444" },
    { name: "🟢", value: "#22c55e" },
    { name: "🔵", value: "#3b82f6" },
    { name: "🟣", value: "#8b5cf6" },
  ];

  function sendMessage() {
    if (message.trim()) {
      $emit("demo:message", {
        text: message,
        time: new Date().toLocaleTimeString(),
      });
      lastSent = `Message: "${message}"`;
      message = "";
    }
  }

  function sendTheme(color) {
    $emit("demo:theme", { color });
    lastSent = `Theme: ${color}`;
  }

  function sendNotification() {
    $emit("demo:notification", {
      title: "Hello!",
      message: "This is a cross-component notification",
      time: new Date().toLocaleTimeString(),
    });
    lastSent = "Notification sent!";
  }
</script>

<style>
  .demo-card {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    border-radius: 12px;
    padding: 1.5rem;
    color: #1f2937;
    box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
  }

  h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1.25rem;
  }

  .description {
    opacity: 0.8;
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }

  .description code {
    background: rgba(0, 0, 0, 0.1);
    padding: 0.125rem 0.375rem;
    border-radius: 4px;
  }

  .demo-content {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .input-section {
    margin-bottom: 1rem;
  }

  .input-section label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }

  .input-section input {
    width: 100%;
    padding: 0.75rem;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 1rem;
    box-sizing: border-box;
  }

  .color-section {
    margin-bottom: 1rem;
  }

  .color-section label {
    display: block;
    font-weight: 500;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }

  .color-buttons {
    display: flex;
    gap: 0.5rem;
  }

  .color-btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.25rem;
    transition: transform 0.1s;
  }

  .color-btn:hover {
    transform: scale(1.1);
  }

  .action-buttons {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .send-btn,
  .notify-btn {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: transform 0.1s;
  }

  .send-btn {
    background: #3b82f6;
    color: white;
  }

  .notify-btn {
    background: #f59e0b;
    color: white;
  }

  .send-btn:hover,
  .notify-btn:hover {
    transform: translateY(-2px);
  }

  .sent-log {
    background: rgba(0, 0, 0, 0.05);
    padding: 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  .sent-log p {
    margin: 0;
  }

  .code-hint {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.8rem;
  }
</style>
