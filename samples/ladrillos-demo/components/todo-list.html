<div class="demo-card">
  <h3>✅ Todo List</h3>
  <p class="description">
    Complete CRUD example combining reactivity, binding & loops
  </p>

  <div class="demo-content">
    <form onsubmit="addTodo(event)" class="add-form">
      <input type="text" $bind="newTodo" placeholder="What needs to be done?" class="todo-input" />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filter-bar">
      <button onclick="filter = 'all'" class="filter-btn {filter === 'all' ? 'active' : ''}">
        All ({todos.length})
      </button>
      <button onclick="filter = 'active'" class="filter-btn {filter === 'active' ? 'active' : ''}">
        Active ({activeTodos})
      </button>
      <button onclick="filter = 'completed'" class="filter-btn {filter === 'completed' ? 'active' : ''}">
        Done ({completedTodos})
      </button>
    </div>

    <if condition="filteredTodos.length === 0">
      <div class="empty-state">
        <span class="empty-icon">📝</span>
        <p>No {filter === 'all' ? '' : filter} todos</p>
      </div>
    </if>
    <else>
      <ul class="todo-list">
        <for each="todo in filteredTodos" key="todo.id">
          <li class="todo-item {todo.completed ? 'completed' : ''}">
            <label class="checkbox-label">
              <input type="checkbox" onclick="toggleTodo({todo.id})" class="todo-checkbox" />
              <span class="checkmark">{todo.completed ? '✓' : ''}</span>
            </label>
            <span class="todo-text">{todo.text}</span>
            <button onclick="removeTodo({todo.id})" class="delete-btn">🗑️</button>
          </li>
        </for>
      </ul>
    </else>

    <if condition="completedTodos > 0">
      <div class="clear-completed">
        <button onclick="clearCompleted()" class="clear-btn">
          Clear completed ({completedTodos})
        </button>
      </div>
    </if>
  </div>

  <div class="code-hint">
    Full CRUD: Add, toggle, delete, filter todos with reactive state
  </div>
</div>

<script>
  let todos = [
    { id: 1, text: "Learn LadrillosJS", completed: true },
    { id: 2, text: "Build awesome components", completed: false },
    { id: 3, text: "Share with the world", completed: false },
  ];
  let newTodo = "";
  let filter = "all";
  let nextId = 4;

  // Computed values
  let filteredTodos = [];
  let activeTodos = 0;
  let completedTodos = 0;

  function updateComputed() {
    activeTodos = todos.filter((t) => !t.completed).length;
    completedTodos = todos.filter((t) => t.completed).length;

    if (filter === "active") {
      filteredTodos = todos.filter((t) => !t.completed);
    } else if (filter === "completed") {
      filteredTodos = todos.filter((t) => t.completed);
    } else {
      filteredTodos = [...todos];
    }
  }

  // Initialize computed values
  updateComputed();

  function addTodo(event) {
    event.preventDefault();
    if (newTodo.trim()) {
      todos = [
        ...todos,
        { id: nextId++, text: newTodo.trim(), completed: false },
      ];
      newTodo = "";
      updateComputed();
    }
  }

  function toggleTodo(id) {
    todos = todos.map((t) =>
      t.id === id ? { ...t, completed: !t.completed } : t
    );
    updateComputed();
  }

  function removeTodo(id) {
    todos = todos.filter((t) => t.id !== id);
    updateComputed();
  }

  function clearCompleted() {
    todos = todos.filter((t) => !t.completed);
    updateComputed();
  }
</script>
