<div class="demo-card">
  <h3>📋 List Rendering</h3>
  <p class="description">Render lists with <code>$for</code> directive</p>

  <div class="demo-content">
    <div class="section">
      <h4>Simple List</h4>
      <ul class="fruit-list">
        <li $for="fruit in fruits" class="fruit-item">🍎 {fruit}</li>
      </ul>
    </div>

    <div class="section">
      <h4>With Index</h4>
      <div class="indexed-list">
        <div
          $for="(color, index) in colors"
          class="color-item"
          style="background: {color}"
        >
          <span class="index">#{index + 1}</span>
          <span class="name">{color}</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h4>Object Array</h4>
      <div class="user-grid">
        <div $for="user in users" class="user-card" $key="user.id">
          <div class="avatar">{user.avatar}</div>
          <div class="info">
            <div class="name">{user.name}</div>
            <div class="role">{user.role}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h4>Dynamic List</h4>
      <div class="controls">
        <input type="text" $bind="newItem" placeholder="Add item..." />
        <button onclick="addItem()">Add</button>
      </div>
      <ul class="dynamic-list">
        <li $for="(item, i) in dynamicItems">
          {item}
          <button onclick="removeItem(i)" class="remove-btn">x</button>
        </li>
      </ul>
    </div>
  </div>

  <div class="code-hint">
    <code $no:bind>&lt;li $for="item in items"&gt;{item}&lt;/li&gt;</code><br />
    <code $no:bind
      >&lt;li $for="(item, i) in items"&gt;#{i}: {item}&lt;/li&gt;</code
    >
  </div>
</div>

<script>
  let fruits = ["Apple", "Banana", "Cherry", "Dragonfruit"];

  let colors = [
    "#ef4444",
    "#f97316",
    "#eab308",
    "#22c55e",
    "#3b82f6",
    "#8b5cf6",
  ];

  let users = [
    { id: 1, name: "Alice", role: "Developer", avatar: "👩‍💻" },
    { id: 2, name: "Bob", role: "Designer", avatar: "👨‍🎨" },
    { id: 3, name: "Carol", role: "Manager", avatar: "👩‍💼" },
  ];

  let dynamicItems = ["First item", "Second item"];
  let newItem = "";

  function addItem() {
    if (newItem.trim()) {
      dynamicItems = [...dynamicItems, newItem.trim()];
      newItem = "";
    }
  }

  function removeItem(index) {
    console.log("Removing item at index:", index);
    dynamicItems = dynamicItems.filter((_, i) => i !== index);
  }
</script>
