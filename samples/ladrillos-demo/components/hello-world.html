    <p>Today is {new Date().toLocaleDateString()}</p>

    <code $no:bind>&lt;h2&gt;Hello, {name}!&lt;/h2&gt;</code>
  </div>
</div>

<script>
  let name = "Developer";
  let framework = "LadrillosJS";
</script>
