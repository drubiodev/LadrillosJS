<div class="demo-card">
  <h3>👋 Hello World</h3>
  <p class="description">
    Basic template binding with <code>{expression}</code> syntax
  </p>

  <div class="demo-content">
    <h2>Hello, {name}!</h2>
    <p>Welcome to <strong>{framework}</strong></p>
    <p>Today is {currentDate}</p>
  </div>

  <div class="code-hint">
    <code $no:bind>&lt;h2&gt;Hello, {name}!&lt;/h2&gt;</code>
  </div>
</div>

<script>
  let name = "Developer";
  let framework = "LadrillosJS";
  let currentDate = new Date().toLocaleDateString();
</script>
