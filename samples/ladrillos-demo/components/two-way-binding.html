<div class="demo-card">
  <h3>🔗 Two-Way Binding</h3>
  <p class="description">
    Use <code>$bind</code> for instant form synchronization
  </p>

  <div class="demo-content">
    <div class="input-group">
      <label>Your Name:</label>
      <input type="text" $bind="username" placeholder="Type here..." />
    </div>

    <div class="input-group">
      <label>Email:</label>
      <input type="email" $bind="email" placeholder="you@example.com" />
    </div>

    <div class="input-group">
      <label>Message:</label>
      <textarea
        $bind="message"
        rows="3"
        placeholder="Write something..."
      ></textarea>
    </div>

    <div class="input-group">
      <label>Favorite Color:</label>
      <select $bind="color">
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="red">Red</option>
        <option value="purple">Purple</option>
      </select>
    </div>

    <div class="preview">
      <h4>Live Preview:</h4>
      <p><strong>Name:</strong> {username || '(empty)'}</p>
      <p><strong>Email:</strong> {email || '(empty)'}</p>
      <p><strong>Message:</strong> {message || '(empty)'}</p>
      <p>
        <strong>Color:</strong>
        <span class="color-badge" style="background: {color}">{color}</span>
      </p>
    </div>
  </div>

  <div class="code-hint">
    <code>&lt;input type="text" $bind="username"&gt;</code>
  </div>
</div>

<script>
  let username = "";
  let email = "";
  let message = "";
  let color = "blue";
</script>

<style>
  .demo-card {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    border-radius: 12px;
    padding: 1.5rem;
    color: white;
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
  }

  h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1.25rem;
  }

  .description {
    opacity: 0.9;
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }

  .description code {
    background: rgba(255, 255, 255, 0.2);
    padding: 0.125rem 0.375rem;
    border-radius: 4px;
  }

  .demo-content {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .input-group {
    margin-bottom: 0.75rem;
  }

  .input-group label {
    display: block;
    font-size: 0.875rem;
    margin-bottom: 0.25rem;
    font-weight: 500;
  }

  .input-group input,
  .input-group textarea,
  .input-group select {
    width: 100%;
    padding: 0.5rem;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    font-size: 0.9rem;
    box-sizing: border-box;
  }

  .input-group input:focus,
  .input-group textarea:focus,
  .input-group select:focus {
    outline: none;
    border-color: white;
  }

  .preview {
    background: rgba(0, 0, 0, 0.15);
    border-radius: 6px;
    padding: 1rem;
    margin-top: 1rem;
  }

  .preview h4 {
    margin: 0 0 0.5rem 0;
    font-size: 0.9rem;
  }

  .preview p {
    margin: 0.25rem 0;
    font-size: 0.85rem;
  }

  .color-badge {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border-radius: 4px;
    color: white;
    font-weight: 500;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .code-hint {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.8rem;
  }
</style>
