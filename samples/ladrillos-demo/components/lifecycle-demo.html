<div class="demo-card">
  <h3>🔄 Lifecycle &amp; $host</h3>
  <p class="description">
    Scripts get <code>$host</code>, <code>$refs</code>, <code>$emit</code> —
    and a <code>ladrillos:ready</code> event
  </p>

  <div class="demo-content">
    <div class="rows">
      <div class="row">
        <span class="label">Element</span>
        <code>&lt;{tag}&gt;</code>
      </div>
      <div class="row">
        <span class="label">Script executed</span>
        <strong>{scriptAt}</strong>
      </div>
      <div class="row">
        <span class="label">ladrillos:ready</span>
        <strong>{readyAt || 'waiting…'}</strong>
      </div>
      <div class="row">
        <span class="label">Reactive updates</span>
        <strong>{ticks}</strong>
      </div>
    </div>
    <div class="button-row">
      <button class="btn btn-primary" onclick="ticks++">
        Trigger update
      </button>
      <button class="btn" onclick="$host.classList.toggle('spotlight')">
        Toggle class on $host
      </button>
    </div>
  </div>

  <div class="code-hint">
    <code $no:bind>$host.addEventListener("ladrillos:ready", ...)</code>
  </div>
</div>

<script>
  let tag = $host.tagName.toLowerCase();
  let scriptAt = new Date().toLocaleTimeString();
  let readyAt = "";
  let ticks = 0;

  $host.addEventListener("ladrillos:ready", () => {
    readyAt = new Date().toLocaleTimeString();
  });
</script>
