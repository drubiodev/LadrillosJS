<div>
  <h3>Loop Event Test</h3>

  <p>Items in array: {items.length}</p>

  <ul>
    <li $for="(item, idx) in items">
      {item} (index: {idx})
      <button onclick="handleClick(idx)">Click me</button>
      <button onclick="console.log('inline log', idx)">Log</button>
    </li>
  </ul>

  <button onclick="addItem()">Add Item</button>
</div>

<script>
  let items = ["One", "Two", "Three"];

  function handleClick(index) {
    console.log("handleClick called with index:", index);
    alert("Clicked item at index: " + index);
  }

  function addItem() {
    console.log("addItem called");
    items = [...items, "New Item " + (items.length + 1)];
  }
</script>
