<div class="demo-card">
  <h3>🎁 Props via Attributes</h3>
  <p class="description">
    Attributes override script defaults — no prop declarations needed
  </p>

  <div class="demo-content">
    <div class="badge-stack">
      <demo-user-badge
        name="Alice"
        role="Engineer"
        color="#3b82f6"
      ></demo-user-badge>
      <demo-user-badge
        name="Bob"
        role="Designer"
        color="#22c55e"
      ></demo-user-badge>
      <!-- No attributes: falls back to script defaults -->
      <demo-user-badge></demo-user-badge>
    </div>

    <div class="live-section">
      <h4>Live-Bound Props</h4>
      <div class="live-controls">
        <input type="text" $bind="liveName" placeholder="Type a name..." />
        <select $bind="liveColor" title="Pick a color">
          <option value="#8b5cf6">Purple</option>
          <option value="#ef4444">Red</option>
          <option value="#f59e0b">Amber</option>
          <option value="#06b6d4">Cyan</option>
        </select>
      </div>
      <demo-user-badge
        name="{liveName || 'You'}"
        role="Live-bound prop"
        color="{liveColor}"
      ></demo-user-badge>
    </div>
  </div>

  <div class="code-hint">
    <code $no:bind>&lt;demo-user-badge name="Alice" role="Engineer"&gt;</code
    ><br />
    <code $no:bind>&lt;demo-user-badge name="{liveName || 'You'}"&gt;</code>
  </div>
</div>

<script>
  let liveName = "";
  let liveColor = "#8b5cf6";
</script>
