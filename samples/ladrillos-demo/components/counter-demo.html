<div class="demo-card">
  <h3>🔢 Counter</h3>
  <p class="description">Reactive state updates the DOM automatically</p>

  <div class="demo-content">
    <div class="counter-display">{count}</div>
    <div class="button-group">
      <button onclick="count--" class="btn btn-minus">−</button>
      <button onclick="count = 0" class="btn btn-reset">Reset</button>
      <button onclick="count++" class="btn btn-plus">+</button>
    </div>
    <p class="computed">Double: {count * 2} | Squared: {count * count}</p>
  </div>

  <div class="code-hint">
    <code>let count = 0;</code><br />
    <code>&lt;button onclick="count++"&gt;+&lt;/button&gt;</code>
  </div>
</div>

<script>
  let count = 0;
</script>
