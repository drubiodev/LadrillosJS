<div class="demo-card">
  <h3>🏷️ Element References</h3>
  <p class="description">
    Use <code>$ref</code> to get direct access to DOM elements
  </p>

  <div class="demo-content">
    <div class="input-section">
      <input
        type="text"
        $ref="inputEl"
        placeholder="Click the button to focus me"
        class="ref-input"
      />
      <button onclick="focusInput()" class="action-btn">🎯 Focus Input</button>
    </div>

    <div class="canvas-section">
      <canvas
        $ref="canvas"
        width="200"
        height="100"
        class="drawing-canvas"
      ></canvas>
      <div class="canvas-controls">
        <button onclick="drawRandom()" class="action-btn">
          🎨 Draw Random
        </button>
        <button onclick="clearCanvas()" class="action-btn secondary">
          🗑️ Clear
        </button>
      </div>
    </div>

    <div class="scroll-section">
      <div $ref="scrollBox" class="scroll-box">
        <p $for="i in Array.from({length: 20}, (_, i) => i + 1)">
          Line {i} - Scroll to see more content
        </p>
      </div>
      <div class="scroll-controls">
        <button onclick="scrollToTop()" class="action-btn">⬆️ Top</button>
        <button onclick="scrollToBottom()" class="action-btn">⬇️ Bottom</button>
      </div>
    </div>
  </div>

  <div class="code-hint">
    <code>&lt;input $ref="inputEl"&gt;</code><br />
    <code>$refs.inputEl.focus();</code>
  </div>
</div>

<script>
  function focusInput() {
    $refs.inputEl.focus();
    $refs.inputEl.select();
  }

  function drawRandom() {
    const canvas = $refs.canvas;
    const ctx = canvas.getContext("2d");

    // Random color
    const hue = Math.floor(Math.random() * 360);
    ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;

    // Random shape
    const x = Math.random() * 170;
    const y = Math.random() * 70;
    const size = 20 + Math.random() * 30;

    ctx.beginPath();
    if (Math.random() > 0.5) {
      ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
    } else {
      ctx.rect(x, y, size, size);
    }
    ctx.fill();
  }

  function clearCanvas() {
    const canvas = $refs.canvas;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function scrollToTop() {
    $refs.scrollBox.scrollTo({ top: 0, behavior: "smooth" });
  }

  function scrollToBottom() {
    $refs.scrollBox.scrollTo({
      top: $refs.scrollBox.scrollHeight,
      behavior: "smooth",
    });
  }
</script>

<style>
  .demo-card {
    background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
    border-radius: 12px;
    padding: 1.5rem;
    color: #1f2937;
    box-shadow: 0 4px 15px rgba(210, 153, 194, 0.4);
  }

  h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1.25rem;
  }

  .description {
    opacity: 0.8;
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }

  .description code {
    background: rgba(0, 0, 0, 0.1);
    padding: 0.125rem 0.375rem;
    border-radius: 4px;
  }

  .demo-content {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .input-section {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  }

  .ref-input {
    flex: 1;
    padding: 0.75rem;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .ref-input:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
  }

  .action-btn {
    padding: 0.5rem 1rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    transition: transform 0.1s;
  }

  .action-btn:hover {
    transform: translateY(-1px);
  }

  .action-btn.secondary {
    background: #6b7280;
  }

  .canvas-section {
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  }

  .drawing-canvas {
    width: 100%;
    height: 100px;
    background: white;
    border: 2px dashed #d1d5db;
    border-radius: 8px;
    margin-bottom: 0.5rem;
  }

  .canvas-controls {
    display: flex;
    gap: 0.5rem;
  }

  .scroll-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .scroll-box {
    height: 100px;
    overflow-y: auto;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    padding: 0.5rem;
    font-size: 0.8rem;
  }

  .scroll-box p {
    margin: 0.25rem 0;
    padding: 0.25rem;
    background: #f3f4f6;
    border-radius: 4px;
  }

  .scroll-controls {
    display: flex;
    gap: 0.5rem;
  }

  .code-hint {
    background: rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.75rem;
  }
</style>
