<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Co-Driver</title>
    <!-- Use local CDN build instead of actual CDN -->
    <script src="http://localhost:3000/ladrillos.iife.js"></script>
    <script>
      ladrillosjs.registerComponent(
        "header-component",
        "./header/header.html",
        false
      );
      ladrillosjs.registerComponent(
        "content-component",
        "./content/content.html",
        false
      );
      ladrillosjs.registerComponent("input-area", "./input/input.html", false);
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(
          135deg,
          #0d1117 0%,
          #161b22 50%,
          #1a1f2e 100%
        );
        min-height: 100vh;
        color: #e6edf3;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .co-driver-container {
        width: 100%;
        max-width: 420px;
        height: 90vh;
        max-height: 700px;
        background: linear-gradient(180deg, #0d1117 0%, #161b22 100%);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #8b949e;
        cursor: pointer;
        transition: color 0.2s;
      }

      .header-left:hover {
        color: #e6edf3;
      }

      .header-right {
        display: flex;
        gap: 12px;
      }

      .header-btn {
        background: none;
        border: none;
        color: #8b949e;
        cursor: pointer;
        padding: 4px;
        transition: color 0.2s;
      }

      .header-btn:hover {
        color: #e6edf3;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px 24px;
        overflow-y: auto;
      }

      .greeting {
        margin-bottom: auto;
      }

      .greeting h1 {
        font-size: 28px;
        font-weight: 600;
        line-height: 1.3;
        color: #e6edf3;
      }

      .suggestions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
        margin-top: auto;
        padding-bottom: 20px;
      }

      .suggestion-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px 18px;
        color: #b0b8c1;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
        max-width: 85%;
      }

      .suggestion-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        color: #e6edf3;
        transform: translateY(-2px);
      }

      .input-area {
        padding: 16px 20px 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      .input-container {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 12px 16px;
      }

      .input-field {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: #e6edf3;
        font-size: 14px;
        margin-bottom: 12px;
      }

      .input-field::placeholder {
        color: #6e7681;
      }

      .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .input-actions-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .action-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b949e;
        cursor: pointer;
        transition: all 0.2s;
      }

      .action-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #e6edf3;
      }

      .smart-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 6px 12px;
        color: #8b949e;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }

      .smart-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #e6edf3;
      }

      .mic-btn {
        background: none;
        border: none;
        color: #8b949e;
        cursor: pointer;
        padding: 4px;
        transition: color 0.2s;
      }

      .mic-btn:hover {
        color: #e6edf3;
      }

      /* Icons using CSS */
      .icon {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="co-driver-container">
      <!-- Header -->
      <header-component></header-component>
      <!-- Content -->
      <content-component class="content" name="Daniel"></content-component>
      <!-- Input Area -->
      <input-area></input-area>
    </div>
  </body>
</html>
