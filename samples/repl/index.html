<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadrillosJS · REPL</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2230;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9198a1;
      --accent: #ff6b35;
      --accent-hover: #e85a28;
      --danger: #f85149;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    /* Thin, theme-matched scrollbars */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-corner {
      background: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }

    /* ── Layout shell ─────────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 6px 1fr;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    /* Draggable divider between the two panes */
    .resizer {
      background: var(--border);
      cursor: col-resize;
      touch-action: none;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--accent);
    }

    body.resizing {
      user-select: none;
    }

    body.resizing iframe {
      pointer-events: none;
    }

    .pane>repl-tabs {
      flex: 0 0 auto;
      display: block;
    }

    .pane>repl-editor {
      flex: 1;
      min-height: 0;
      display: block;
    }

    /* Shared pane header (used by the tabs strip and the preview label) */
    .pane-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .pane-head .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    footer {
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 6px 1fr;
      }

      .resizer {
        cursor: row-resize;
      }
    }
  </style>

  <!-- Monaco editor (VS Code's editor) from CDN, no build step -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    // Monaco is bootstrapped once here and shared by the editor component via
    // window.loadMonaco(). Keeping it out of the component avoids re-loading it
    // and sidesteps cross-origin worker issues.
    const MONACO_CDN =
      "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min";

    // Monaco runs language services in web workers. Loading them from a CDN is
    // cross-origin, so hand Monaco a same-origin data-URL shim that in turn
    // importScripts() the real worker from the CDN.
    window.MonacoEnvironment = {
      getWorkerUrl() {
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
          self.MonacoEnvironment = { baseUrl: "${MONACO_CDN}/" };
          importScripts("${MONACO_CDN}/vs/base/worker/workerMain.js");
        `)}`;
      },
    };

    require.config({ paths: { vs: `${MONACO_CDN}/vs` } });

    let __monacoPromise;
    window.loadMonaco = () => {
      if (!__monacoPromise) {
        __monacoPromise = new Promise((resolve) => {
          require(["vs/editor/editor.main"], () => resolve(window.monaco));
        });
      }
      return __monacoPromise;
    };
  </script>
</head>

<body>
  <repl-header></repl-header>

  <main>
    <section class="pane">
      <repl-tabs></repl-tabs>
      <repl-editor></repl-editor>
    </section>
    <div class="resizer" id="resizer" title="Drag to resize"></div>
    <section class="pane">
      <repl-preview></repl-preview>
    </section>
  </main>

  <footer>
    Edit the files on the left — the preview updates live. Loaded straight
    from the CDN, no build step. ·
    <a href="../../docs/README.md">Docs</a> ·
    <a href="https://github.com/drubiodev/LadrillosJS">GitHub</a>
  </footer>

  <!-- The REPL is itself built from LadrillosJS components. -->
  <script type="module">
    import { registerComponents } from "https://cdn.jsdelivr.net/npm/ladrillosjs@latest/dist/index.js";
    import { EVENTS } from "./common/events.js";
    import { EXAMPLES, EXAMPLE_NAMES } from "./common/examples.js";

    // Bridge the shared modules onto a global the components can read from a
    // plain <script>. (Component-local ESM imports don't survive the published
    // runtime's reactive-state setup, so we centralize once here.)
    window.REPL = { EVENTS, EXAMPLES, EXAMPLE_NAMES };

    await registerComponents([
      { name: "repl-header", path: "./components/header/header.html", useShadowDOM: false },
      { name: "repl-tabs", path: "./components/tabs/tabs.html", useShadowDOM: false },
      { name: "repl-editor", path: "./components/editor/editor.html", useShadowDOM: false },
      { name: "repl-preview", path: "./components/preview/preview.html", useShadowDOM: false },
    ]);
  </script>

  <script>
    // Drag the divider to resize the editor / preview panes. Uses fr units so
    // the split stays proportional when the window itself resizes. Monaco's
    // automaticLayout + the iframe reflow to the new size on their own.
    (function () {
      const main = document.querySelector("main");
      const resizer = document.getElementById("resizer");
      const mq = matchMedia("(max-width: 800px)");

      resizer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const vertical = mq.matches; // stacked layout resizes top/bottom
        const rect = main.getBoundingClientRect();
        resizer.setPointerCapture(e.pointerId);
        resizer.classList.add("dragging");
        document.body.classList.add("resizing");
        document.body.style.cursor = vertical ? "row-resize" : "col-resize";

        const onMove = (ev) => {
          const frac = vertical
            ? (ev.clientY - rect.top) / rect.height
            : (ev.clientX - rect.left) / rect.width;
          const f = Math.max(0.15, Math.min(0.85, frac));
          const track = `${f}fr 6px ${1 - f}fr`;
          if (vertical) main.style.gridTemplateRows = track;
          else main.style.gridTemplateColumns = track;
        };

        const onUp = () => {
          resizer.releasePointerCapture(e.pointerId);
          resizer.classList.remove("dragging");
          document.body.classList.remove("resizing");
          document.body.style.cursor = "";
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
        };

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });

      // Crossing the breakpoint swaps rows<->columns; drop stale inline sizing
      // so the CSS layout takes over cleanly.
      mq.addEventListener("change", () => {
        main.style.gridTemplateColumns = "";
        main.style.gridTemplateRows = "";
      });
    })();
  </script>
</body>

</html>
