<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadrillosJS · REPL</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2230;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9198a1;
      --accent: #ff6b35;
      --accent-hover: #e85a28;
      --danger: #f85149;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
        "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    /* Thin, theme-matched scrollbars */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-corner {
      background: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    header h1 .brick {
      color: var(--accent);
    }

    header .spacer {
      flex: 1;
    }

    header label {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    select,
    button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
    }

    select:hover,
    button:hover {
      border-color: var(--muted);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .pane+.pane {
      border-left: 1px solid var(--border);
    }

    .pane-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .pane-head .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* File tabs */
    .tabs-head {
      padding: 0 0.4rem;
      gap: 0.35rem;
      text-transform: none;
      letter-spacing: normal;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 2px;
      flex: 1;
      overflow-x: auto;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.7rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 0;
      border-top: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab:focus,
    .tab:focus-visible {
      outline: none;
    }

    .tab.active {
      color: var(--text);
      background: var(--bg);
      border-top-color: var(--accent);
    }

    .tab .root-badge {
      font-size: 0.58rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tab .close {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 0 0.1rem;
      opacity: 0.6;
    }

    .tab .close:hover {
      opacity: 1;
      color: var(--danger);
    }

    .tab-add {
      flex: none;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
    }

    .tab-add:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    #editor {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .preview-wrap {
      flex: 1;
      position: relative;
      background: #fff;
    }

    #preview {
      border: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    #error {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 45%;
      overflow: auto;
      margin: 0;
      padding: 0.75rem 1rem;
      background: #2b1315;
      color: #ffb4ab;
      border-top: 1px solid var(--danger);
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
    }

    #error.show {
      display: block;
    }

    footer {
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .pane+.pane {
        border-left: 0;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1><span class="brick">▚</span> LadrillosJS · REPL</h1>
    <div class="spacer"></div>
    <label>
      Example
      <select id="examples"></select>
    </label>
    <button class="primary" id="run">Run ▸</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head tabs-head">
        <span class="dot"></span>
        <div class="tabs" id="tabs"></div>
        <button class="tab-add" id="addFile" title="Add a component file">+ file</button>
      </div>
      <!-- Monaco editor mounts here -->
      <div id="editor"></div>
    </section>

    <section class="pane">
      <div class="pane-head"><span class="dot"></span> Preview</div>
      <div class="preview-wrap">
        <iframe id="preview" title="preview"
          sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        <pre id="error"></pre>
      </div>
    </section>
  </main>

  <footer>
    Edit the files on the left — the preview updates live. Loaded straight
    from the CDN, no build step. ·
    <a href="../../docs/README.md">Docs</a> ·
    <a href="https://github.com/drubiodev/LadrillosJS">GitHub</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

  <script>
    // LadrillosJS ESM entry (change to a local /dist path to run offline).
    const CDN = "https://cdn.jsdelivr.net/npm/ladrillosjs@latest/dist/index.js";

    // ── Starter examples ───────────────────────────────────────────────

      "Todo list": [{
        name: "demo-todo", code: `<div class="todo">
  <h2>Todo ({items.length})</h2>
  <form $on:submit.prevent="add()">
    <input $bind="draft" placeholder="What needs doing?" />
    <button>Add</button>
  </form>

  <if condition="items.length === 0">
    <p class="empty">Nothing yet — add something above.</p>
  </if>
  <else>
    <ul>
      <for each="item in items" key="item.id">
        <li class="{item.done ? 'done' : ''}">
          <button class="check" onclick="toggle(item.id)">
            {item.done ? '☑' : '☐'}
          </button>
          <span>{item.text}</span>
          <button class="x" onclick="remove(item.id)">×</button>
        </li>
      </for>
    </ul>
  </else>
</div>

<script>
  let draft = "";
  let nextId = 1;
  let items = [];

  function add() {
    const text = draft.trim();
    if (!text) return;
    items = [...items, { id: nextId++, text, done: false }];
    draft = "";
  }

  function toggle(id) {
    items = items.map((i) => (i.id === id ? { ...i, done: !i.done } : i));
  }

  function remove(id) {
    items = items.filter((i) => i.id !== id);
  }
<\/script>

    };

    // ── DOM refs ────────────────────────────────────────────────────
    let editor; // Monaco editor instance (created once the loader is ready)
    let files = []; // [{ tag, model }] — the first file is the mounted root
    let activeIndex = 0;
    let newFileSeq = 0;

    const preview = document.getElementById("preview");
    const errorBox = document.getElementById("error");
    const examplesSel = document.getElementById("examples");
    const runBtn = document.getElementById("run");
    const tabsEl = document.getElementById("tabs");
    const addFileBtn = document.getElementById("addFile");

    // Populate example dropdown
    for (const name of Object.keys(EXAMPLES)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      examplesSel.appendChild(opt);
    }

    // ── Multi-file editor (tabs) ────────────────────────────────────
    // Each file is a component: its tab name is the custom-element tag.
    function makeFile(tag, code) {
      return { tag, model: monaco.editor.createModel(code, "html") };
    }

    function loadExample(name) {
      for (const f of files) f.model.dispose();
      files = EXAMPLES[name].map((f) => makeFile(f.name, f.code));
      activeIndex = 0;
      editor.setModel(files[0].model);
      renderTabs();
      run();
    }

    function selectFile(i) {
      activeIndex = i;
      editor.setModel(files[i].model);
      renderTabs();
      editor.focus();
    }

    function addFile() {
      const tag = uniqueTag("my-component");
      files.push(makeFile(tag, defaultFileCode(tag)));
      selectFile(files.length - 1);
      run();
    }

    function removeFile(i) {
      if (i === 0 || files.length <= 1) return; // keep the root file
      files[i].model.dispose();
      files.splice(i, 1);
      activeIndex = Math.min(activeIndex, files.length - 1);
      editor.setModel(files[activeIndex].model);
      renderTabs();
      run();
    }

    function renameFile(i) {
      const current = files[i].tag;
      const next = (
        window.prompt(
          "Component tag name (lowercase, must contain a hyphen):",
          current
        ) || ""
      ).trim();
      if (!next || next === current) return;
      if (!/^[a-z][a-z0-9]*-[a-z0-9-]*$/.test(next)) {
        showError(
          `Invalid tag "${next}". Custom element names must be lowercase and contain a hyphen, e.g. "user-card".`
        );
        return;
      }
      if (files.some((f, j) => j !== i && f.tag === next)) {
        showError(`A file named "${next}" already exists.`);
        return;
      }
      files[i].tag = next;
      renderTabs();
      run();
    }

    function uniqueTag(base) {
      let n = ++newFileSeq;
      let tag = `${base}-${n}`;
      while (files.some((f) => f.tag === tag)) tag = `${base}-${++n}`;
      return tag;
    }

    function defaultFileCode(tag) {
      return [
        `<div class="box">`,
        `  <p>Hello from &lt;${tag}&gt;</p>`,
        `</div>`,
        ``,
        `<style>`,
        `  .box { font-family: system-ui; padding: 1rem; }`,
        `</style>`,
      ].join("\n");
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      files.forEach((f, i) => {
        const tab = document.createElement("button");
        tab.className = "tab" + (i === activeIndex ? " active" : "");
        tab.title = "Double-click to rename";

        const label = document.createElement("span");
        label.textContent = f.tag + ".html";
        tab.appendChild(label);

        if (i === 0) {
          const badge = document.createElement("span");
          badge.className = "root-badge";
          badge.textContent = "root";
          tab.appendChild(badge);
        } else if (files.length > 1) {
          const close = document.createElement("span");
          close.className = "close";
          close.textContent = "×";
          close.title = "Remove file";
          close.addEventListener("click", (e) => {
            e.stopPropagation();
            removeFile(i);
          });
          tab.appendChild(close);
        }

        tab.addEventListener("click", () => selectFile(i));
        tab.addEventListener("dblclick", () => renameFile(i));
        tabsEl.appendChild(tab);
      });
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }
    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.remove("show");
    }

    // Build & mount the preview: register every file as a component, then
    // instantiate the first one (the "root") inside the sandboxed iframe.
    let activeBlobUrls = [];
    function run() {
      if (!editor || files.length === 0) return;
      clearError();

      // Each file becomes a same-origin blob the sandbox can fetch. With
      // `allow-same-origin` + `srcdoc`, the iframe inherits our origin, so the
      // blob URLs are fetchable inside the sandbox.
      for (const u of activeBlobUrls) URL.revokeObjectURL(u);
      activeBlobUrls = [];
      const regs = files.map((f) => {
        const base = URL.createObjectURL(
          new Blob([f.model.getValue()], { type: "text/html" })
        );
        activeBlobUrls.push(base);
        // `#.html` makes the loader treat the blob as a direct .html source.
        return { tag: f.tag, url: base + "#.html" };
      });
      const rootTag = regs[0].tag;

      const doc = `<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      body { padding: 8px; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module">
      import ladrillos, { configure } from "${CDN}";

      const post = (message) =>
        parent.postMessage({ __repl: "error", message }, "*");

      configure({ onError: (err) => post(err?.message || String(err)) });
      window.addEventListener("error", (e) => post(e.message));
      window.addEventListener("unhandledrejection", (e) =>
        post(e.reason?.message || String(e.reason))
      );

      const files = ${JSON.stringify(regs)};
      try {
        // Register every component first, then mount the root element.
        for (const f of files) {
          await ladrillos.registerComponent(f.tag, f.url, true);
        }
        document
          .getElementById("mount")
          .appendChild(document.createElement("${rootTag}"));
      } catch (e) {
        post(e?.message || String(e));
      }
    <\/script>
  </body>
</html>`;

      preview.srcdoc = doc;
    }

    // Surface framework/runtime errors from the sandbox
    window.addEventListener("message", (e) => {
      if (e.data && e.data.__repl === "error" && e.data.message) {
        showError(e.data.message);
      }
    });

    // ── Monaco editor setup ────────────────────────────────────────
    const MONACO_CDN =
      "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min";

    // Monaco runs language services in web workers. Loading them from a CDN is
    // cross-origin, so hand Monaco a same-origin data-URL shim that in turn
    // importScripts() the real worker from the CDN.
    window.MonacoEnvironment = {
      getWorkerUrl() {
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: "${MONACO_CDN}/" };
                    importScripts("${MONACO_CDN}/vs/base/worker/workerMain.js");
                `)}`;
      },
    };

    require.config({ paths: { vs: `${MONACO_CDN}/vs` } });
    require(["vs/editor/editor.main"], () => {
      editor = monaco.editor.create(document.getElementById("editor"), {
        language: "html", // highlights embedded <script> and <style> too
        theme: "vs-dark",
        automaticLayout: true,
        minimap: { enabled: false },
        fontFamily:
          'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace',
        fontSize: 13,
        lineHeight: 21,
        tabSize: 2,
        scrollBeyondLastLine: false,
        padding: { top: 12, bottom: 12 },
        scrollbar: {
          verticalScrollbarSize: 10,
          horizontalScrollbarSize: 10,
          useShadows: false,
        },
      });

      // Debounced live re-run on edit
      let timer;
      editor.onDidChangeModelContent(() => {
        clearTimeout(timer);
        timer = setTimeout(run, 400);
      });

      examplesSel.addEventListener("change", () => loadExample(examplesSel.value));
      runBtn.addEventListener("click", run);
      addFileBtn.addEventListener("click", addFile);

      // Load the first example (creates models, tabs, and renders)
      loadExample(Object.keys(EXAMPLES)[0]);
    });
  </script>
</body>

</html>
