<div class="pane-head tabs-head">
    <span class="dot"></span>
    <div class="tabs">
        <for each="(tab, i) in tabs" key="tab.tag">
            <button class="tab {i === activeIndex ? 'active' : ''}" title="Double-click to rename" onclick="select(i)"
                $on:dblclick="rename(i)">
                <span>{tab.tag}.html</span>
                <if condition="i === 0">
                    <span class="root-badge">root</span>
                </if>
                <else-if condition="tabs.length > 1">
                    <span class="close" title="Remove file" $on:click.stop="closeFile(i)">×</span>
                </else-if>
            </button>
        </for>
    </div>
    <button class="tab-add" title="Add a component file" onclick="add()">+ file</button>
</div>

<script>
    const EVENTS = window.REPL.EVENTS;

    // Mirror of the editor's file list — kept in sync over the event bus.
    let tabs = [];
    let activeIndex = 0;

    $listen(EVENTS.FILES_CHANGED, (data) => {
        tabs = data.tabs;
        activeIndex = data.activeIndex;
    });

    function select(i) {
        $emit(EVENTS.TAB_SELECT, i);
    }

    function closeFile(i) {
        $emit(EVENTS.TAB_CLOSE, i);
    }

    function rename(i) {
        $emit(EVENTS.TAB_RENAME, i);
    }

    function add() {
        $emit(EVENTS.FILE_ADD);
    }
</script>

<style>
    .tabs-head {
        padding: 0 0.4rem;
        gap: 0.35rem;
        text-transform: none;
        letter-spacing: normal;
        overflow: hidden;
    }

    .tabs {
        display: flex;
        gap: 2px;
        flex: 1;
        overflow-x: auto;
    }

    .tab {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.7rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 0;
        border-top: 2px solid transparent;
        cursor: pointer;
        white-space: nowrap;
    }

    .tab:hover {
        color: var(--text);
    }

    .tab:focus,
    .tab:focus-visible {
        outline: none;
    }

    .tab.active {
        color: var(--text);
        background: var(--bg);
        border-top-color: var(--accent);
    }

    .tab .root-badge {
        font-size: 0.58rem;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 0 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .tab .close {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        padding: 0 0.1rem;
        opacity: 0.6;
    }

    .tab .close:hover {
        opacity: 1;
        color: var(--danger);
    }

    .tab-add {
        flex: none;
        font-size: 0.72rem;
        color: var(--muted);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
    }

    .tab-add:hover {
        color: var(--text);
        border-color: var(--muted);
    }
</style>
