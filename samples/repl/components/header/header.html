<header>
    <h1><span class="brick">▚</span> LadrillosJS · REPL</h1>
    <div class="spacer"></div>
    <label>
        Example
        <select $bind="selected" onchange="pick(event)">
            <for each="name in names">
                <option value="{name}">{name}</option>
            </for>
        </select>
    </label>
    <button class="primary" onclick="run()">Run ▸</button>
</header>

<script>
    // Shared constants come from the shell on window.REPL (the published runtime
    // can't keep ESM imports reactive inside a component, so we bridge globally).
    let names = window.REPL.EXAMPLE_NAMES;
    let selected = window.REPL.EXAMPLE_NAMES[0];

    // Read the value straight off the event: relying on `selected` here races
    // the $bind sync and emits the previously-selected example.
    function pick(e) {
        selected = e.target.value;
        $emit(window.REPL.EVENTS.EXAMPLE_SELECT, e.target.value);
    }

    function run() {
        $emit(window.REPL.EVENTS.RUN);
    }
</script>
