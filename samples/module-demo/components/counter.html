<template>
  <div class="counter-wrapper">
    <h3>Counter Component</h3>
    <div class="counter-display">
      <button class="btn-decrement">-</button>
      <span class="count">{count}</span>
      <button class="btn-increment">+</button>
    </div>
    <button class="btn-reset">Reset</button>
    <p style="font-size: 12px; color: #666; margin-top: 10px">
      Registered via ES module in app.js
    </p>
  </div>
</template>

<style>
  .counter-wrapper {
    text-align: center;
  }

  .counter-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
  }

  .count {
    font-size: 48px;
    font-weight: bold;
    color: #4f46e5;
    min-width: 80px;
  }

  .btn-decrement,
  .btn-increment {
    width: 50px;
    height: 50px;
    font-size: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-reset {
    margin-top: 10px;
    background: #64748b;
  }

  .btn-reset:hover {
    background: #475569;
  }
</style>

<script>
  // Initialize state
  this.state.count = 0;

  // Event handlers
  const increment = () => {
    this.state.count++;
    $emit("counter_updated", this.state.count);
  };

  const decrement = () => {
    this.state.count--;
    $emit("counter_updated", this.state.count);
  };

  const reset = () => {
    this.state.count = 0;
    $emit("counter_updated", this.state.count);
  };

  // Bind events
  $querySelector(".btn-increment").addEventListener("click", increment);
  $querySelector(".btn-decrement").addEventListener("click", decrement);
  $querySelector(".btn-reset").addEventListener("click", reset);
</script>
